<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — CareerOS</title>
  <meta name="theme-color" content="#7C6CF2">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #080B14;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #121829;
      border: 1px solid #28324A;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon-container {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(124, 108, 242, 0.15);
      border: 1px solid rgba(124, 108, 242, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      color: #8B7CF6;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #F8FAFC;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      height: 44px;
      width: 100%;
      background-color: #7C6CF2;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    button:hover {
      background-color: #6C5CE7;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>CareerOS needs an active connection to sync your latest career focus and logs.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
