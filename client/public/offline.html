<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — VALARI</title>
  <meta name="theme-color" content="#FF7A00">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #090D16;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #111827;
      border: 1px solid #263247;
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.4);
    }
    .brand-mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 1.125rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #FF7A00;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #F8FAFC;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.875rem;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      height: 46px;
      width: 100%;
      background-color: #FF7A00;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
      box-shadow: 0 2px 10px rgba(255, 122, 0, 0.25);
    }
    button:hover {
      background-color: #FF8A1F;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="13" fill="#0D121C" stroke="#263247" stroke-width="1"/>
        <path d="M11 13L21.5 35.5C22.1 36.8 23.9 36.8 24.5 35.5L37 13" stroke="#FF7A00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M27.5 24L37 8" stroke="#FFC400" stroke-width="5" stroke-linecap="round"/>
        <path d="M29 8H37V16" stroke="#FFC400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-title">VALARI</div>
    <h1>You're offline.</h1>
    <p>Reconnect to continue your latest synced work.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
