<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — EYTHU</title>
  <meta name="theme-color" content="#2A7A3B">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0F17;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #111827;
      border: 1px solid #253044;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
    }
    .brand-mark {
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #F8FAFC;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #F8FAFC;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #2A7A3B;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #22653A;
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">
      <img src="/brand/eythu-logo.png" alt="EYTHU" width="72" height="72" style="display: block; margin: 0 auto; object-fit: contain; aspect-ratio: auto;" />
    </div>
    <div class="brand-title">EYTHU</div>
    <h1>You're offline.</h1>
    <p>Reconnect to continue your latest synced work.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
  <p style="margin-top: 20px; font-size: 11px; color: #64748B;">
    EYTHU — A product by TamZode Technology
  </p>
</body>
</html>
